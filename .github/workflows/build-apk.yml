name: Build MotionLab APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: motionlab-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project root
        run: |
          test -f settings.gradle.kts || { echo "settings.gradle.kts tidak ada di root repo. Isi ZIP harus langsung di root."; ls -la; exit 1; }
          test -f app/build.gradle.kts || { echo "app/build.gradle.kts tidak ada."; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Proyek tidak menyertakan Gradle Wrapper; Gradle 8.9 dipin di runner (cocok dengan AGP 8.7.x).
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --console=plain :app:assembleDebug 2>&1 | tee build-log.txt
        shell: bash

      - name: Summarize errors
        if: failure()
        run: |
          echo "## Ringkasan error kompilasi" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|FAILED|What went wrong" -A2 build-log.txt | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MotionLab-build-log
          path: build-log.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MotionLab-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
