name: MotionLab CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      with_ffmpeg:
        description: "Also build the optional LGPL FFmpeg and an APK that bundles it"
        type: boolean
        default: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM + Robolectric)
        run: ./gradlew test --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/"

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MotionLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  build-apk-ffmpeg:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.with_ffmpeg }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build LGPL FFmpeg (arm64-v8a)
        run: |
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          ANDROID_NDK_HOME="$NDK_DIR" scripts/build_ffmpeg_android.sh
      - name: Assemble debug APK with FFmpeg
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MotionLab-debug-apk-ffmpeg
          path: app/build/outputs/apk/debug/*.apk

  instrumented-tests:
    # Real JNI + OpenGL ES tests on an emulator. Slow, so it does not block the other jobs.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew :native:cpp-core:connectedDebugAndroidTest :engine:rendering:connectedDebugAndroidTest --stacktrace
